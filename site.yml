---
- name: Enterprise Server Health & Telemetry Audit
  hosts: all
  connection: local
  gather_facts: yes

  tasks:
    - name: Display Target System Telemetry
      debug:
        msg: "Executing automated audit on host: {{ inventory_hostname }} running {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Verify Container Runtime & Disk Space
      shell: df -h /
      register: disk_telemetry

    - name: Output Disk Utilization Report
      debug:
        var: disk_telemetry.stdout_lines

    - name: Confirm Application Gateway Ports
      wait_for:
        port: "{{ item }}"
        timeout: 2
      loop:
        - 8080
        - 8081
        - 3000
      ignore_errors: yes
      register: port_audit

    - name: Summarize Infrastructure Compliance Status
      debug:
        msg: "SUCCESS: Server configuration baseline verified. All automation telemetry synced."
